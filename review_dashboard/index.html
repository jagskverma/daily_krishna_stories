<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Krishna Stories — Editorial Review</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand">Daily Krishna Stories <span class="badge">Pilot · 48</span></div>
  <div id="progress" class="progress"></div>
  <div class="top-actions">
    <input id="search" type="search" placeholder="Search title, ID, character…">
  </div>
</header>

<div id="filters" class="filters">
  <select id="f-status"><option value="">All statuses</option></select>
  <select id="f-stage"><option value="">All life stages</option></select>
  <select id="f-arc"><option value="">All arcs</option></select>
  <select id="f-source"><option value="">All sources</option></select>
  <select id="f-theme"><option value="">All themes</option></select>
  <button id="f-clear" class="ghost">Clear</button>
</div>

<main id="app">
  <section id="list-view">
    <table id="story-table">
      <thead><tr>
        <th>ID</th><th>Title</th><th>Stage</th><th>Arc</th><th>Primary source</th>
        <th>Read</th><th>Fidelity</th><th>Status</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="reader-view" class="hidden">
    <div class="reader-top">
      <button id="back" class="ghost">← All stories</button>
      <div id="reader-meta" class="reader-meta"></div>
    </div>
    <article class="reader">
      <h1 id="r-title"></h1>
      <p id="r-subtitle" class="subtitle"></p>
      <div id="r-story" class="prose"></div>
      <div id="r-reflection" class="reflection"></div>
      <div class="reader-foot">
        <div id="r-sources" class="sources"></div>
        <div id="r-tradition" class="tradition"></div>
        <div id="r-next" class="next"></div>
      </div>
    </article>
    <aside class="evidence">
      <details id="evidence-panel">
        <summary>Source Evidence</summary>
        <div id="evidence-body"></div>
      </details>
    </aside>
    <div class="review-controls">
      <div class="status-buttons">
        <button data-status="approved" class="btn-approve">Approve</button>
        <button data-status="needs_revision" class="btn-revise">Needs Revision</button>
        <button data-status="rejected" class="btn-reject">Reject</button>
        <button data-status="unreviewed" class="ghost">Reset</button>
      </div>
      <textarea id="comment" rows="3" placeholder="Free-form feedback — e.g. “Too devotional.” “Opening is weak.” “Remove the moral.” “I like this exact tone.”"></textarea>
      <button id="comment-send" class="primary">Add comment</button>
      <div id="comments" class="comments"></div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
